<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Prime Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0F171E;
            color: white;
        }

        /* Navbar */

        nav {
            background: #00050D;
            padding: 20px 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .logo .prime {
            color: #00A8E1;
        }

        .logo .smile {
            width: 26px;
            height: 12px;
            align-self: center;
        }

        /* Hero */

        .hero {
            height: 250px;
            background:
                linear-gradient(to right, rgba(15, 23, 30, .85), rgba(15, 23, 30, .1)),
                linear-gradient(to bottom, rgba(15, 23, 30, .2), #0F171E),
                url("https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: flex-end;

            padding: 40px 60px;
        }

        .hero h1 {
            font-size: 50px;
        }

        /* Movies */

        .container {
            padding: 40px 60px;
        }

        .container h2 {
            margin-bottom: 25px;
        }

        .movies {

            display: grid;

            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));

            gap: 25px;

        }

        .card {

            background: #222;

            border-radius: 10px;

            overflow: hidden;

            transition: .3s;

            cursor: pointer;

        }

        .card:hover {

            transform: scale(1.08);

            box-shadow: 0 0 20px rgba(255, 255, 255, .25);

        }

        .card img {

            width: 100%;

            height: 320px;

            object-fit: cover;

        }

        .info {

            padding: 15px;

        }

        .info h3 {

            margin-bottom: 10px;

        }

        .genre {

            color: #bbbbbb;

        }

        .year {

            color: #46d369;

            margin-top: 10px;

            font-weight: bold;

        }

        /* Modal */

        .modal {

            display: none;

            position: fixed;

            z-index: 999;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            overflow: auto;

            background: rgba(0, 0, 0, .92);

        }

        .modal-content {

            background: #1f1f1f;

            width: 80%;

            max-width: 1000px;

            margin: 40px auto 60px;

            border-radius: 12px;

            overflow: hidden;

            position: relative;

        }

        /* 16:9 banner: the poster is portrait, so it is blurred to fill the
           strip and the sharp, uncropped poster sits centred on top. */

        .banner-wrap {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #000;

        }

        .banner-blur {

            position: absolute;

            inset: 0;

            background-size: cover;

            background-position: center;

            filter: blur(30px) brightness(.45) saturate(1.3);

            /* hides the soft edges the blur leaves at the boundary */

            transform: scale(1.2);

        }

        .banner {

            position: relative;

            display: block;

            height: 100%;

            width: auto;

            max-width: 100%;

            margin: 0 auto;

            object-fit: contain;

        }

        .details {

            padding: 30px;

        }

        .details h1 {

            margin-bottom: 15px;

        }

        .meta {

            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            margin-bottom: 20px;

            color: #cccccc;

        }

        .description {

            margin: 20px 0;

            line-height: 1.7;

            color: #dddddd;

        }

        iframe {

            width: 100%;

            aspect-ratio: 16 / 9;

            height: auto;

            border: none;

            border-radius: 8px;

        }

        .close {

            position: absolute;

            right: 40px;

            top: 20px;

            font-size: 50px;

            line-height: 1;

            cursor: pointer;

            color: white;

            z-index: 1000;

        }

        .close:hover {

            color: #00A8E1;

        }

        @media (max-width: 600px) {

            .modal-content {

                width: 95%;

            }

            .details {

                padding: 18px;

            }

        }
    </style>

</head>

<body>

    <nav>

        <div class="logo">
            <span class="prime">prime</span>
            <span>video</span>
            <svg class="smile" viewBox="0 0 52 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2 9 C 14 22, 38 22, 50 9" stroke="#00A8E1" stroke-width="5" stroke-linecap="round" fill="none"/>
                <path d="M46 14 L 50 9 L 44 8" stroke="#00A8E1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </div>

    </nav>

    <div class="hero">

        <h1>Popular Movies</h1>

    </div>

    <div class="container">

        <h2>Trending Now</h2>

        <div class="movies">

            {% for movie in movies %}

            <div class="card" data-name="{{ movie.name }}" data-genre="{{ movie.genre }}"
                data-year="{{ movie.releaseYear }}" data-rating="{{ movie.rating }}"
                data-duration="{{ movie.duration }}" data-director="{{ movie.director }}" data-cast="{{ movie.cast }}"
                data-description="{{ movie.description }}" data-poster="{{ movie.bannerUrl }}"
                data-trailer="{{ movie.trailer }}" onclick="showMovie(this)">

                <img src="{{ movie.bannerUrl }}" alt="{{ movie.name }}" loading="lazy">

                <div class="info">

                    <h3>{{ movie.name }}</h3>

                    <p class="genre">{{ movie.genre }}</p>

                    <p class="year">{{ movie.releaseYear }}</p>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- Movie Popup -->

    <div class="modal" id="movieModal">

        <span class="close" onclick="closeMovie()">&times;</span>

        <div class="modal-content">

            <div class="banner-wrap">

                <div class="banner-blur" id="posterBlur"></div>

                <img id="poster" class="banner" alt="">

            </div>

            <div class="details">

                <h1 id="title"></h1>

                <div class="meta">

                    <span id="year"></span>

                    <span id="genre"></span>

                    <span id="rating"></span>

                    <span id="duration"></span>

                </div>

                <p><strong>Director:</strong> <span id="director"></span></p>

                <br>

                <p><strong>Cast:</strong> <span id="cast"></span></p>

                <div class="description" id="description"></div>

                <h2>Official Trailer</h2>

                <br>

                <iframe id="trailer" src="about:blank" title="YouTube video player" frameborder="0"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>

    <script>

        function showMovie(card) {

            document.getElementById("movieModal").style.display = "block";

            document.getElementById("poster").src = card.dataset.poster;

            document.getElementById("poster").alt = card.dataset.name + " poster";

            document.getElementById("posterBlur").style.backgroundImage =
                'url("' + encodeURI(card.dataset.poster) + '")';

            document.getElementById("title").textContent = card.dataset.name;

            document.getElementById("year").textContent = "📅 " + card.dataset.year;

            document.getElementById("genre").textContent = "🎬 " + card.dataset.genre;

            document.getElementById("rating").textContent = "⭐ " + card.dataset.rating;

            document.getElementById("duration").textContent = "⏱ " + card.dataset.duration;

            document.getElementById("director").textContent = card.dataset.director;

            document.getElementById("cast").textContent = card.dataset.cast;

            document.getElementById("description").textContent = card.dataset.description;

            document.getElementById("trailer").src = card.dataset.trailer;

            document.body.style.overflow = "hidden";

        }

        function closeMovie() {

            document.getElementById("movieModal").style.display = "none";

            // "about:blank", not "" — an empty src resolves against the page URL
            // and would reload this whole page inside the iframe.
            document.getElementById("trailer").src = "about:blank";

            document.body.style.overflow = "";

        }

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                closeMovie();

            }

        });

        window.onclick = function (event) {

            var modal = document.getElementById("movieModal");

            if (event.target == modal) {

                closeMovie();

            }

        }

    </script>

</body>

</html>
